# Local infrastructure for the Exatech platform (alternative to Homebrew services).
#   docker compose up -d
# Then: pnpm setup:local && pnpm dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exatech
      POSTGRES_PASSWORD: exatech
      POSTGRES_DB: exatech
    ports: ['5432:5432']
    volumes: ['pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exatech']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio:/data']
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  pg: {}
  minio: {}
# With this compose file use DATABASE_URL=postgres://exatech:exatech@localhost:5432/exatech
